<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureHoney — Натуральний мед</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="#" class="logo">PureHoney</a>
            <nav class="nav">
                <a href="#home">Головна</a>
                <a href="#products">Продукти</a>
                <a href="#about">Про нас</a>
            </nav>
            <div class="header-right">
                <div class="cart-icon-wrapper" id="cart-trigger">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>Чистий натуральний мед з пасіки</h1>
            <p>100% натуральний продукт без домішок.</p>
            <a href="#products" class="btn-primary">Замовити</a>
        </div>
    </section>

    <section id="products" class="products-section">
        <div class="container">
            <h2 class="section-title">Наш мед</h2>
            <div id="products-grid" class="products-grid"></div>
        </div>
    </section>

    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Ваш кошик</h3>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-body" id="cart-items">
            <p class="empty-message">Кошик порожній</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Загалом:</span>
                <span id="cart-total-price">0</span> ₴
            </div>
            <button class="btn-checkout" id="checkout-trigger">Оформити замовлення</button>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <h3>Оформлення замовлення</h3>
            <form id="order-form" action="https://formspree.io/f/xbldwzpr" method="POST">
                <input type="hidden" name="cart_summary" id="hidden-cart-data">
                <input type="hidden" name="total_price" id="hidden-total-price">
                <div class="form-group">
                    <label>Ваше ім'я:</label>
                    <input type="text" name="name" required placeholder="Ім'я">
                </div>
                <div class="form-group">
                    <label>Телефон:</label>
                    <input type="tel" name="phone" required placeholder="+380...">
                </div>
                <div class="form-group">
                    <label>Доставка:</label>
                    <input type="text" name="address" required placeholder="Місто / № НП">
                </div>
                <button type="submit" class="btn-submit" id="submit-order-btn">Підтвердити</button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
