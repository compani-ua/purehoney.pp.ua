<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміна — PureHoney</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .admin-card { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-admin { background: #8B3A14; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-admin:hover { background: #6d2d0f; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-section" class="admin-card">
        <h2>Панель адміна</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email адміна:</label>
                <input type="email" id="admin-email" required placeholder="pasaa451@gmail.com">
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" id="admin-password" required>
            </div>
            <button type="submit" class="btn-admin">Увійти</button>
        </form>
    </div>

    <div id="dashboard-section" class="admin-card hidden">
        <h2>Додати новий мед</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label>Назва товару:</label>
                <input type="text" id="prod-title" required placeholder="Травневий мед">
            </div>
            <div class="form-group">
                <label>Опис:</label>
                <textarea id="prod-desc" required placeholder="Різнотрав'я з сонячних лугів..."></textarea>
            </div>
            <div class="form-group">
                <label>Шлях до фото (наприклад: img/may-honey.jpg):</label>
                <input type="text" id="prod-img" required placeholder="img/may-honey.jpg">
            </div>
            <div class="form-group">
                <label>Ціна (₴):</label>
                <input type="number" id="prod-price" required placeholder="250">
            </div>
            <button type="submit" class="btn-admin">Додати товар</button>
        </form>
        <button id="logout-btn" style="margin-top: 15px; background: #666;" class="btn-admin">Вийти</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_FGyYTdIMDQlogkjgHdeahoMMKp9w2Q",
            authDomain: "pure-honey-33616.firebaseapp.com",
            projectId: "pure-honey-33616",
            storageBucket: "pure-honey-33616.firebasestorage.app",
            messagingSenderId: "275030343750",
            appId: "1:275030343750:web:1403062f029c255a4b0a47",
            measurementId: "G-SM6X56RK74"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert('Помилка входу: ' + err.message);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "products"), {
                    title: document.getElementById('prod-title').value,
                    description: document.getElementById('prod-desc').value,
                    image: document.getElementById('prod-img').value,
                    price: Number(document.getElementById('prod-price').value),
                    createdAt: new Date()
                });
                alert('Товар успішно додано!');
                e.target.reset();
            } catch (err) {
                alert('Помилка додавання: ' + err.message);
            }
        });
    </script>
</body>
</html>
