<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміна — PureHoney</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fdfbf7; padding: 20px; color: #333; }
        .admin-card { max-width: 500px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .admin-card h2 { color: #8B3A14; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #8B3A14; }
        .btn-admin { background: #8B3A14; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .btn-admin:hover { background: #6d2d0f; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-section" class="admin-card">
        <h2>Панель адміністратора</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email адміна:</label>
                <input type="email" id="admin-email" value="pasaa451@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" id="admin-password" placeholder="Введіть пароль" required>
            </div>
            <button type="submit" class="btn-admin">Увійти</button>
        </form>
    </div>

    <div id="dashboard-section" class="admin-card hidden">
        <h2>Додати новий мед</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label>Назва товару:</label>
                <input type="text" id="prod-title" placeholder="напр. Травневий мед" required>
            </div>
            <div class="form-group">
                <label>Опис:</label>
                <textarea id="prod-desc" rows="3" placeholder="Опис товару..." required></textarea>
            </div>
            <div class="form-group">
                <label>Шлях до фото у вашій папці img/ :</label>
                <input type="text" id="prod-img" placeholder="img/may-honey.jpg" required>
            </div>
            <div class="form-group">
                <label>Базова ціна за 350g (₴):</label>
                <input type="number" id="prod-price" placeholder="250" required>
            </div>
            <button type="submit" class="btn-admin">Додати товар на сайт</button>
        </form>
        <button id="logout-btn" style="margin-top: 15px; background: #666;" class="btn-admin">Вийти</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_FGyYTdIMDQlogkjgHdeahoMMKp9w2Q",
            authDomain: "pure-honey-33616.firebaseapp.com",
            projectId: "pure-honey-33616",
            storageBucket: "pure-honey-33616.firebasestorage.app",
            messagingSenderId: "275030343750",
            appId: "1:275030343750:web:1403062f029c255a4b0a47"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-password').value;
            if (pass) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
        });

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "products"), {
                    title: document.getElementById('prod-title').value,
                    description: document.getElementById('prod-desc').value,
                    image: document.getElementById('prod-img').value,
                    price: Number(document.getElementById('prod-price').value),
                    createdAt: new Date()
                });
                alert('Товар успішно додано! Перевірте головну сторінку.');
                e.target.reset();
            } catch (err) {
                alert('Помилка збереження: ' + err.message);
            }
        });
    </script>
</body>
</html>
